version: "3.9"

# All real secrets/config come from a .env file (see .env.example) — this
# file itself contains only variable references and safe fallback
# defaults for local dev, never a real secret value. Copy .env.example to
# .env and fill it in before running this anywhere reachable by real users.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sri_apartment_os}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # OS10-TEST-ISOLATION-01: a fully separate Postgres instance dedicated to
  # pytest. Different container, different volume, different database name,
  # different host port — never the same server or database as `db` above.
  # See backend/tests/conftest.py for the safety guard that refuses to run
  # any test if this isn't what's actually configured.
  test-db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_TEST_DB:-sri_apartment_os_test}
    ports:
      - "5433:5432"
    volumes:
      - pgdata_test:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      test-db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-sri_apartment_os}
      # OS10-TEST-ISOLATION-01: the ONLY database pytest is allowed to use
      # (see backend/tests/conftest.py). Separate service (test-db), never db.
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@test-db:5432/${POSTGRES_TEST_DB:-sri_apartment_os_test}
      GUEST_DOCUMENT_STORAGE_BACKEND: ${GUEST_DOCUMENT_STORAGE_BACKEND:-local}
      GUEST_DOCUMENT_STORAGE_DIR: ${GUEST_DOCUMENT_STORAGE_DIR:-/tmp/sri_apartment_guest_documents}
      GUEST_DOCUMENT_S3_BUCKET: ${GUEST_DOCUMENT_S3_BUCKET:-}
      GUEST_DOCUMENT_S3_REGION: ${GUEST_DOCUMENT_S3_REGION:-}
      GUEST_DOCUMENT_S3_ENDPOINT_URL: ${GUEST_DOCUMENT_S3_ENDPOINT_URL:-}
      GUEST_DOCUMENT_S3_ADDRESSING_STYLE: ${GUEST_DOCUMENT_S3_ADDRESSING_STYLE:-auto}
      GUEST_DOCUMENT_S3_ACCESS_KEY_ID: ${GUEST_DOCUMENT_S3_ACCESS_KEY_ID:-}
      GUEST_DOCUMENT_S3_SECRET_ACCESS_KEY: ${GUEST_DOCUMENT_S3_SECRET_ACCESS_KEY:-}
      GUEST_DOCUMENT_S3_SERVER_SIDE_ENCRYPTION: ${GUEST_DOCUMENT_S3_SERVER_SIDE_ENCRYPTION:-AES256}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      # RBAC Phase A: only consumed once, at first seed, to create the
      # initial admin account (see backend/app/db/seed.py). Empty is fine
      # on every run after that first one, since the admin already exists.
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-homestaypdy@gmail.com}
      # Email provider switch — safe default "gmail_smtp" (unchanged
      # behavior). RESEND_* only take effect if EMAIL_PROVIDER=resend is
      # explicitly set in .env.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-gmail_smtp}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      # LOCAL customer login Email OTP testing — never consulted in
      # production (see customer_auth/router.py). Safe defaults: no real
      # email is ever sent unless both are explicitly overridden in .env.
      CUSTOMER_AUTH_EMAIL_OTP_MODE: ${CUSTOMER_AUTH_EMAIL_OTP_MODE:-dev_code}
      CUSTOMER_AUTH_EMAIL_OTP_TEST_ALLOWLIST: ${CUSTOMER_AUTH_EMAIL_OTP_TEST_ALLOWLIST:-}
      # Base URL of the public customer-facing website — password-reset
      # links and, since Phase 3G, every redirect back to the frontend
      # after a Google OAuth attempt. Production sets this to
      # https://sriapartment.in.
      CUSTOMER_PORTAL_BASE_URL: ${CUSTOMER_PORTAL_BASE_URL:-http://localhost:5175}
      # Google OAuth (customer-facing "Continue with Google") — blank
      # keeps the honest "not configured" 501 behavior. Production sets
      # GOOGLE_REDIRECT_URI to its own public API domain, e.g.
      # https://api.sriapartment.in/api/v1/customer-auth/oauth/google/callback
      # — see backend/.env.example and customer_auth/oauth_router.py's
      # module docstring for the full Google Cloud Console setup.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/customer-auth/oauth/google/callback}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ZOTEL_BASE_URL: ${ZOTEL_BASE_URL:-}
      ZOTEL_API_KEY: ${ZOTEL_API_KEY:-}
      ZOTEL_API_SECRET: ${ZOTEL_API_SECRET:-}
      ZOTEL_HOTEL_ID: ${ZOTEL_HOTEL_ID:-}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v19.0}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      REMINDER_SCAN_INTERVAL_MINUTES: ${REMINDER_SCAN_INTERVAL_MINUTES:-60}
      ZOTEL_SYNC_INTERVAL_MINUTES: ${ZOTEL_SYNC_INTERVAL_MINUTES:-15}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python -m app.db.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      # Local-disk file storage (invoices, quotations, attachments,
      # photos) — these named volumes are what make those survive a
      # container restart/recreate. Without them, every uploaded file and
      # generated PDF is lost the moment the container is rebuilt, since
      # the container's own filesystem is ephemeral. See
      # docs/DEPLOYMENT.md for the full explanation and the object-storage
      # (S3-equivalent) upgrade path for true production durability.
      - uploads_reports:/tmp/sri_apartment_reports
      - uploads_attachments:/tmp/sri_apartment_attachments
      - uploads_hk_photos:/tmp/sri_apartment_housekeeping_photos
      - uploads_maint_photos:/tmp/sri_apartment_maintenance_photos
      - uploads_expense_attachments:/tmp/sri_apartment_expense_attachments
      - uploads_invoices:/tmp/sri_apartment_invoices
      - uploads_credit_notes:/tmp/sri_apartment_credit_notes
      - uploads_guest_docs:/tmp/sri_apartment_guest_documents
      - uploads_logo:/tmp/sri_apartment_logo
      - uploads_qr:/tmp/sri_apartment_qr
      - uploads_inquiry_attachments:/tmp/sri_apartment_inquiry_attachments
      - uploads_inquiry_pdfs:/tmp/sri_apartment_inquiries
      - uploads_unit_photos:/tmp/sri_apartment_unit_photos
      - uploads_property_files:/tmp/sri_apartment_property_files

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:?VITE_API_BASE_URL must be set for the frontend build}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
  pgdata_test:
  uploads_reports:
  uploads_attachments:
  uploads_hk_photos:
  uploads_maint_photos:
  uploads_expense_attachments:
  uploads_invoices:
  uploads_credit_notes:
  uploads_guest_docs:
  uploads_logo:
  uploads_qr:
  uploads_inquiry_attachments:
  uploads_inquiry_pdfs:
  uploads_unit_photos:
  uploads_property_files:
