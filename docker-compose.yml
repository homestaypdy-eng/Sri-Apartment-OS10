version: "3.9"

# All real secrets/config come from a .env file (see .env.example) — this
# file itself contains only variable references and safe fallback
# defaults for local dev, never a real secret value. Copy .env.example to
# .env and fill it in before running this anywhere reachable by real users.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-sri_apartment_os}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@db:5432/${POSTGRES_DB:-sri_apartment_os}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?JWT_SECRET_KEY must be set in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-homestaypdy@gmail.com}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
      ENABLE_SCHEDULER: ${ENABLE_SCHEDULER:-false}
      REMINDER_SCAN_INTERVAL_MINUTES: ${REMINDER_SCAN_INTERVAL_MINUTES:-60}
      ENVIRONMENT: ${ENVIRONMENT:-production}
    ports:
      - "8000:8000"
    command: >
      sh -c "
        python -m app.db.seed &&
        uvicorn app.main:app --host 0.0.0.0 --port 8000
      "
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
    volumes:
      # Local-disk file storage (invoices, quotations, attachments,
      # photos) — these named volumes are what make those survive a
      # container restart/recreate. Without them, every uploaded file and
      # generated PDF is lost the moment the container is rebuilt, since
      # the container's own filesystem is ephemeral. See
      # docs/DEPLOYMENT.md for the full explanation and the object-storage
      # (S3-equivalent) upgrade path for true production durability.
      - uploads_reports:/tmp/sri_apartment_reports
      - uploads_attachments:/tmp/sri_apartment_attachments
      - uploads_hk_photos:/tmp/sri_apartment_housekeeping_photos
      - uploads_maint_photos:/tmp/sri_apartment_maintenance_photos
      - uploads_expense_attachments:/tmp/sri_apartment_expense_attachments
      - uploads_invoices:/tmp/sri_apartment_invoices
      - uploads_credit_notes:/tmp/sri_apartment_credit_notes
      - uploads_guest_docs:/tmp/sri_apartment_guest_documents
      - uploads_logo:/tmp/sri_apartment_logo
      - uploads_qr:/tmp/sri_apartment_qr
      - uploads_inquiry_attachments:/tmp/sri_apartment_inquiry_attachments
      - uploads_inquiry_pdfs:/tmp/sri_apartment_inquiries
      - uploads_unit_photos:/tmp/sri_apartment_unit_photos
      - uploads_property_files:/tmp/sri_apartment_property_files

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads_reports:
  uploads_attachments:
  uploads_hk_photos:
  uploads_maint_photos:
  uploads_expense_attachments:
  uploads_invoices:
  uploads_credit_notes:
  uploads_guest_docs:
  uploads_logo:
  uploads_qr:
  uploads_inquiry_attachments:
  uploads_inquiry_pdfs:
  uploads_unit_photos:
  uploads_property_files:
