# Backend test + diagnostics CI for the OS10 FastAPI backend.
#
# SECURITY / SAFETY POSTURE (deliberate):
#   * permissions: contents: read ONLY — this job never writes to the repo,
#     never touches issues/PRs/packages, and carries no token scope it
#     doesn't need. No `pull_request_target` (that would run with a
#     read/write token against untrusted fork code) — plain `pull_request`.
#   * No deploy steps, no production secrets, no `secrets.*` references at
#     all. Every credential below is a throwaway value created inside the
#     runner purely so the test harness can boot; none is sensitive and none
#     is echoed. JWT_SECRET_KEY / BOOTSTRAP_ADMIN_PASSWORD are test-only
#     values the seed/app code requires to start — not real secrets.
#   * Postgres is an ephemeral `services:` container, destroyed with the
#     runner. The suite's own safety gate (tests/conftest.py,
#     OS10-TEST-ISOLATION-01) FORBIDS port 5432 and any db named without
#     "test", so the service's 5432 is published on host port 5433 and the
#     suite is pointed at sri_apartment_os_test on 5433.
#   * Actions are version-pinned (tags); the repo has no SHA-pin convention.
name: backend-ci

on:
  push:
    branches:
      - main
      - claude/slack-session-cn15eo
  pull_request:
    branches:
      - main
      - claude/slack-session-cn15eo

# Least privilege: this workflow only reads the checked-out code.
permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Ephemeral Postgres for the test suite. Published on host port 5433
    # (NOT 5432) because tests/conftest.py refuses to run against 5432.
    # POSTGRES_INITDB_ARGS forces the UTF8 encoding the suite expects.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_throwaway_password
          POSTGRES_DB: sri_apartment_os_test
          POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
        ports:
          - 5433:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # The ONLY database the suite is allowed to touch. Host port 5433,
      # db name contains "test" — both required by the conftest safety gate.
      TEST_DATABASE_URL: "postgresql+psycopg://postgres:ci_throwaway_password@localhost:5433/sri_apartment_os_test"
      # Test-only app config so seed()/app import can boot. Not real secrets.
      JWT_SECRET_KEY: "ci_test_only_jwt_secret_not_used_in_production"
      BOOTSTRAP_ADMIN_PASSWORD: "ci_test_admin_password"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        # Try the exact pins first. If the psycopg[binary]==3.2.1 pin is
        # unavailable on the index, fall back to a RELAXED copy generated in
        # the runner's temp dir only — requirements.txt itself is never
        # edited (kept byte-for-byte as committed).
        run: |
          python -m pip install --upgrade pip
          if ! pip install -r requirements.txt; then
            echo "Exact dependency pins failed to resolve; retrying with a relaxed psycopg pin (workflow-only, requirements.txt unchanged)."
            sed 's/^psycopg\[binary\]==3\.2\.1$/psycopg[binary]>=3.2.1,<3.3/' requirements.txt > "$RUNNER_TEMP/requirements.ci.txt"
            pip install -r "$RUNNER_TEMP/requirements.ci.txt"
          fi

      - name: Diagnostics (versions, import smoke test, collection count)
        # Lightweight debugging aids only — no secret values are printed.
        run: |
          echo "::group::Python / tooling versions"
          python --version
          pip --version
          python -c "import sqlalchemy, fastapi, pydantic; print('sqlalchemy', sqlalchemy.__version__); print('fastapi', fastapi.__version__); print('pydantic', pydantic.__version__)"
          python -c "import psycopg; print('psycopg', psycopg.__version__)"
          echo "::endgroup::"
          echo "::group::Application import smoke test"
          python -c "import app.main; print('app.main imported OK')"
          echo "::endgroup::"
          echo "::group::Test collection count"
          python -m pytest --collect-only -q tests | tail -n 1
          echo "::endgroup::"

      - name: Run backend tests (Zotel + payments/cancellation financial-safety subset)
        # A clearly-scoped FAST SUBSET focused on the Zotel import and
        # payment-reconciliation paths plus the shared cancellation/refund
        # workflow — the financially-sensitive area — to keep CI runtime
        # reasonable. The whole suite (tests/) can be substituted here if a
        # full run is wanted; the DB/env setup above already supports it.
        run: |
          python -m pytest -q \
            tests/test_zotel_integration.py \
            tests/test_zotel_multiroom.py \
            tests/test_zotel_unplaceable_underrecording.py \
            tests/test_zotel_mapping_drift.py \
            tests/test_zotel_sync_lock.py \
            tests/test_zotel_phone_normalization.py \
            tests/test_zotel_scheduler.py \
            tests/test_zotel_mapping_audit_log.py \
            tests/test_finance_cash_flow_zotel_mode.py \
            tests/test_cancellation_v2_provider_zotel.py \
            tests/test_cancellation_workflow.py \
            tests/test_cancellation_policy_unit.py
