server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response this container serves — the
    # backend API already sets these on its own JSON responses, but the
    # actual HTML page the browser loads (served here, by nginx) needs
    # them too; a browser's clickjacking/MIME-sniffing protections are
    # enforced based on the headers on the page itself, not just on API
    # calls made from it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is intentionally NOT set here: it instructs browsers to refuse
    # plain HTTP for this domain for a long time afterward, which is
    # actively harmful to set before TLS/HTTPS is actually terminated in
    # front of this container (see docs/DEPLOYMENT.md's SSL section) —
    # add it at the reverse proxy/load balancer once HTTPS is live, not here.

    # Gzip real static assets (JS/CSS bundles) — meaningfully reduces
    # transfer size for the same bundles measured in the performance pass.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
