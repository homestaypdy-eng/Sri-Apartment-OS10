server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers on every response this container serves — the
    # backend API already sets these on its own JSON responses, but the
    # actual HTML page the browser loads (served here, by nginx) needs
    # them too; a browser's clickjacking/MIME-sniffing protections are
    # enforced based on the headers on the page itself, not just on API
    # calls made from it.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS is intentionally NOT set here: it instructs browsers to refuse
    # plain HTTP for this domain for a long time afterward, which is
    # actively harmful to set before TLS/HTTPS is actually terminated in
    # front of this container (see docs/DEPLOYMENT.md's SSL section) —
    # add it at the reverse proxy/load balancer once HTTPS is live, not here.

    # Gzip real static assets (JS/CSS bundles) — meaningfully reduces
    # transfer size for the same bundles measured in the performance pass.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # nginx's add_header does NOT merge across levels — a location block
    # that sets its own add_header silently drops the server-level security
    # headers above for that location, rather than adding to them. Every
    # location below repeats them for that reason, not out of redundancy.

    # Vite's build gives every JS/CSS bundle a content hash in its filename
    # (e.g. index-CzU0K9_V.js) — a new deployment with different content
    # always produces a different filename, so these can be cached
    # essentially forever; a stale cached copy is never served under a
    # filename that still matches the current index.html's references.
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The service worker and its manifest are the mechanism that detects a
    # new deployment (registerType: 'autoUpdate' in vite.config.ts diffs
    # sw.js byte-for-byte against what's installed) — if a browser or proxy
    # caches an old copy of sw.js, that detection itself is delayed, which
    # is the actual stale-bundle failure mode this closes.
    location = /sw.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /registerSW.js {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }
    location = /manifest.webmanifest {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
    }

    # index.html is unhashed and references the current build's hashed
    # asset filenames — it must always be revalidated so a fresh deploy is
    # visible on next load, not pinned by a browser's heuristic HTML cache.
    location / {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
